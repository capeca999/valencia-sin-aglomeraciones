name: Actualizar eventos

on:
  schedule:
    - cron: "15 5 * * *"    # cada mañana (06:15 en invierno, 07:15 en verano, hora de Valencia) + aviso al móvil
    - cron: "15 16 * * *"   # repaso por la tarde, sin aviso
    - cron: "0 20 * * *"    # 21:00 en invierno (22:00 en verano): aviso de mañana
  push:
    branches: [main]
    paths: ["scraper/**", ".github/workflows/**", "docs/**", "config.json"]
  workflow_dispatch:
    inputs:
      notificar:
        description: "Enviar el aviso al móvil"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Buscar eventos en las fuentes oficiales
        env:
          VSA_DEBUG: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python -m scraper.main

      - name: Pictogramas ARASAAC
        continue-on-error: true
        env:
          VSA_DEBUG: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python -m scraper.pictos

      - name: Comprobar el tráfico en tiempo real (diagnóstico)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          mkdir -p debug
          curl -s --max-time 30 "https://geoportal.valencia.es/server/rest/services/OPENDATA/Trafico/MapServer/192/query?where=1%3D1&outFields=*&outSR=4326&f=geojson&resultRecordCount=3" -o debug/geoportal.json -D debug/geoportal_headers.txt || true
          curl -s --max-time 30 "https://geoportal.valencia.es/server/rest/services/OPENDATA/Trafico/MapServer?f=json" -o debug/geoportal_trafico_layers.json || true
          curl -s --max-time 30 "https://geoportal.valencia.es/server/rest/services/OPENDATA?f=json" -o debug/geoportal_opendata_services.json || true
          for L in 233 232 237 209; do curl -s --max-time 40 "https://geoportal.valencia.es/server/rest/services/OPENDATA/Trafico/MapServer/$L/query?where=1%3D1&outFields=*&outSR=4326&f=json&resultRecordCount=8&returnGeometry=false" -o debug/geo_layer_$L.json || true; curl -s --max-time 40 "https://geoportal.valencia.es/server/rest/services/OPENDATA/Trafico/MapServer/$L/query?where=1%3D1&returnCountOnly=true&f=json" -o debug/geo_count_$L.json || true; done
          for q in afecciones cortes talls eventos agenda; do curl -s --max-time 30 "https://opendata.vlci.valencia.es/api/3/action/package_search?q=$q&rows=20" -o debug/ckan_$q.json || true; done

      - name: Aviso al móvil de hoy (ntfy)
        if: github.event.schedule == '15 5 * * *' || inputs.notificar
        continue-on-error: true
        run: python -m scraper.notify morning

      - name: Aviso al móvil de mañana (ntfy)
        if: github.event.schedule == '0 20 * * *'
        continue-on-error: true
        run: python -m scraper.notify evening

      - name: Revisar que todo funciona (aviso privado)
        if: github.event.schedule == '15 5 * * *'
        continue-on-error: true
        run: python -m scraper.health

      # Las copias de páginas para diagnóstico NO se suben al repositorio (pueden llevar claves de webs ajenas):
      # se guardan 7 días como adjunto privado de la ejecución.
      - name: Guardar diagnóstico (privado)
        if: always() && hashFiles('debug/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico
          path: debug
          retention-days: 7

      - name: Guardar datos
        run: |
          git config user.name "valencia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/events.json docs/pictos docs/cal
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Actualizar eventos $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push

      - name: Avisar si la actualización ha fallado
        if: failure() && github.event_name == 'schedule'
        run: python -m scraper.health --failed

  web:
    needs: datos
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
